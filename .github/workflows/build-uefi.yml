name: build-uefi

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Mu-Silicium codename (Resources/Configs/<device>.toml)"
        required: true
        default: tas
      mu_ref:
        description: "Mu-Silicium git ref"
        required: true
        default: main
      mode:
        description: "Build mode"
        type: choice
        options: [DEBUG, RELEASE]
        default: DEBUG
      model:
        description: "Device model index"
        required: true
        default: "0"
      qemu:
        description: "Run QEMU load smoke (not a hardware test)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "platforms/**"
      - "config/tas.toml"
      - "scripts/fetch-uefi.sh"
      - ".github/workflows/build-uefi.yml"

permissions:
  contents: write

env:
  MU_DIR: ${{ github.workspace }}/Mu-Silicium

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve inputs
        id: in
        run: |
          echo "device=${{ inputs.device || 'tas' }}" >> "$GITHUB_OUTPUT"
          echo "mu_ref=${{ inputs.mu_ref || 'main' }}" >> "$GITHUB_OUTPUT"
          echo "mode=${{ inputs.mode || 'DEBUG' }}" >> "$GITHUB_OUTPUT"
          echo "model=${{ inputs.model || '0' }}" >> "$GITHUB_OUTPUT"

      - name: Cache Mu-Silicium
        uses: actions/cache@v4
        with:
          path: Mu-Silicium
          key: mu-${{ steps.in.outputs.mu_ref }}-${{ hashFiles('scripts/fetch-uefi.sh') }}
          restore-keys: |
            mu-${{ steps.in.outputs.mu_ref }}-

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Fetch Mu-Silicium
        run: |
          set -o pipefail
          bash scripts/fetch-uefi.sh "$MU_DIR" "${{ steps.in.outputs.mu_ref }}" 2>&1 | tee fetch-uefi.log

      - name: Overlay tas package
        run: |
          mkdir -p Mu-Silicium/Platforms/Huawei
          rm -rf Mu-Silicium/Platforms/Huawei/tasPkg
          cp -r platforms/Huawei/tasPkg Mu-Silicium/Platforms/Huawei/
          cp config/tas.toml Mu-Silicium/Resources/Configs/tas.toml
          python3 scripts/make-minimal-dtb.py Mu-Silicium/Resources/DTBs/tas.dtb

      - name: Check device exists
        working-directory: Mu-Silicium
        run: |
          device="${{ steps.in.outputs.device }}"
          if [ ! -f "Resources/Configs/${device}.toml" ]; then
            echo "::error::No Resources/Configs/${device}.toml. Known codenames:"
            ls Resources/Configs | sed 's/\.toml$//' | sort | head -100
            exit 1
          fi

      - name: Install dependencies
        working-directory: Mu-Silicium
        run: bash ./setup_env.sh -p apt

      - name: Build UEFI
        working-directory: Mu-Silicium
        run: |
          set -o pipefail
          python3 build_uefi.py \
            -d "${{ steps.in.outputs.device }}" \
            -r "${{ steps.in.outputs.mode }}" \
            -m "${{ steps.in.outputs.model }}" \
            -c 2>&1 | tee build-uefi.log

      - name: Verify firmware volume
        run: |
          python3 scripts/verify-fv.py \
            "Mu-Silicium/Build/${{ steps.in.outputs.device }}Pkg/${{ steps.in.outputs.mode }}_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Publish UEFI payload
        run: |
          mkdir -p builds
          gzip -9 -c "Mu-Silicium/Build/${{ steps.in.outputs.device }}Pkg/${{ steps.in.outputs.mode }}_CLANGPDB/FV/SILICIUM_UEFI.fd" \
            > builds/tas-uefi.fd.gz
          shim="$(find Mu-Silicium -maxdepth 3 -name BootShim.bin | head -1)"
          if [ -n "$shim" ]; then cp "$shim" builds/tas-bootshim.bin; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/tas-uefi.fd.gz builds/tas-bootshim.bin
          git commit -m "tas uefi ${GITHUB_RUN_NUMBER}" || echo "no changes"
          git push origin HEAD:main || true

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p builds
          {
            echo "=== fetch-uefi.sh output ==="
            tail -n 400 fetch-uefi.log 2>/dev/null || true
            echo
            echo "=== build-uefi.py output ==="
            tail -n 1200 Mu-Silicium/build-uefi.log 2>/dev/null || true
            echo
            echo "=== Build.log files ==="
            find Mu-Silicium/Build -name 'Build.log' 2>/dev/null | while read -r f; do
              echo "--- $f"
              tail -n 400 "$f" 2>/dev/null || true
            done
          } > builds/tas-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/tas-build.log
          git commit -m "tas build failure ${GITHUB_RUN_NUMBER}" || echo "no changes"
          git push origin HEAD:main || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uefi-${{ steps.in.outputs.device }}-${{ steps.in.outputs.mode }}
          path: |
            Mu-Silicium/Mu-*
            Mu-Silicium/Build/${{ steps.in.outputs.device }}Pkg/${{ steps.in.outputs.mode }}_CLANGPDB/FV/SILICIUM_UEFI.fd
          if-no-files-found: error
          compression-level: 9

  qemu-smoke:
    if: ${{ inputs.qemu }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uefi-${{ inputs.device || 'tas' }}-${{ inputs.mode || 'DEBUG' }}
          path: out

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm

      - name: Load firmware in QEMU
        run: |
          fd="$(find out -name SILICIUM_UEFI.fd | head -1)"
          echo "firmware: $fd"
          # A phone FV has no drivers for QEMU's virt machine, so this only
          # proves the image loads and the CPU starts executing it.
          timeout 20s qemu-system-aarch64 -M virt -cpu cortex-a57 -m 1024 \
            -bios "$fd" -nographic -no-reboot || \
            echo "QEMU exited (expected: firmware targets real hardware)"
