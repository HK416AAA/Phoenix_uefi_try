name: build-charlotte

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - charlotte-9010-unixnu
    paths:
      - platforms/Huawei/charlottePkg/**
      - config/charlotte.toml
      - scripts/fetch-uefi.sh
      - .github/workflows/build-charlotte.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Fetch uefi-sheng
        env:
          MU_REPO: https://github.com/UniXNU/uefi-sheng.git
        run: |
          set -o pipefail
          bash scripts/fetch-uefi.sh uefi-sheng sheng 2>&1 | tee fetch-charlotte.log

      - name: Fetch UniXNU
        run: |
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU
          git -C UniXNU submodule update --init --depth 1
          find UniXNU -maxdepth 6 -name '*.inf' | sort > unixnu-inf.txt || true
          head -80 unixnu-inf.txt || true

      - name: Overlay charlotte package
        run: |
          mkdir -p uefi-sheng/Platforms/Huawei
          rm -rf uefi-sheng/Platforms/Huawei/charlottePkg
          cp -r platforms/Huawei/charlottePkg uefi-sheng/Platforms/Huawei/
          cp config/charlotte.toml uefi-sheng/Resources/Configs/charlotte.toml

      - name: Generate charlotte DTB
        run: |
          python3 scripts/make-charlotte-dtb.py uefi-sheng/Resources/DTBs/charlotte.dtb
          ls -l uefi-sheng/Resources/DTBs
          test -s uefi-sheng/Resources/DTBs/charlotte.dtb

      - name: Install dependencies
        working-directory: uefi-sheng
        run: bash setup_env.sh -p apt

      - name: Build
        working-directory: uefi-sheng
        env:
          UNIXNU_ROOT: ${{ github.workspace }}/UniXNU
        run: |
          set -o pipefail
          python3 build_uefi.py -d charlotte -r DEBUG -c 2>&1 | tee build-charlotte.log

      - name: Verify firmware volume
        run: |
          python3 scripts/verify-fv.py \
            "uefi-sheng/Build/charlottePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd"

      - name: Publish failure log
        if: failure()
        run: |
          mkdir -p builds
          {
            echo "=== fetch ==="
            tail -n 400 fetch-charlotte.log 2>/dev/null || true
            echo
            echo "=== build ==="
            tail -n 1500 uefi-sheng/build-charlotte.log 2>/dev/null || true
            echo
            echo "=== unixnu inf ==="
            tail -n 100 unixnu-inf.txt 2>/dev/null || true
            echo
            echo "=== dtbs ==="
            ls -l uefi-sheng/Resources/DTBs 2>/dev/null || true
            grep -n "mkbootimg\|--dtb\|DTB image" uefi-sheng/build-charlotte.log 2>/dev/null | tail -20 || true
            echo
            echo "=== Build.log ==="
            find uefi-sheng/Build -name 'Build.log' 2>/dev/null | while read -r f; do
              echo "--- $f"
              tail -n 500 "$f" 2>/dev/null || true
            done
          } > builds/charlotte-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/charlotte-build.log
          git commit -m "charlotte build failure ${GITHUB_RUN_NUMBER}" || echo "no changes"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then break; fi
            sleep 5
          done

      - name: Publish UEFI payload
        if: success()
        run: |
          mkdir -p builds
          gzip -9 -c \
            "uefi-sheng/Build/charlottePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd" \
            > builds/charlotte-uefi.fd.gz
          shim="$(find uefi-sheng -maxdepth 4 -name BootShim.bin | head -1)"
          if [ -n "$shim" ]; then cp "$shim" builds/charlotte-bootshim.bin; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/charlotte-uefi.fd.gz
          if [ -f builds/charlotte-bootshim.bin ]; then git add -f builds/charlotte-bootshim.bin; fi
          git commit -m "charlotte uefi ${GITHUB_RUN_NUMBER}" || echo "no changes"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then break; fi
            sleep 5
          done

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: charlotte-uefi-DEBUG
          path: |
            uefi-sheng/Build/charlottePkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          if-no-files-found: error
