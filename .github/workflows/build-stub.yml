name: build-stub

on:
  workflow_dispatch:
  push:
    paths:
      - "stub/**"
      - ".github/workflows/build-stub.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build stubs
        run: |
          mkdir -p out
          for name in stub stub-reset; do
            src="stub/start.S"
            if [ "$name" = "stub-reset" ]; then src="stub/reset.S"; fi
            clang --target=aarch64-none-elf -nostdlib -fno-stack-protector -fuse-ld=lld \
              -Wl,-T,stub/stub.ld -Wl,-e,_start -Wl,--oformat=binary \
              -o "out/$name.bin" "$src"
          done
          for name in payload-fb-wdt payload-pstore; do
            src="stub/${name//-/_}.S"
            clang --target=aarch64-none-elf -nostdlib -fno-stack-protector -fuse-ld=lld \
              -Wl,-T,stub/stub.ld -Wl,-e,_start -Wl,--oformat=binary \
              -o "out/$name.bin" "$src"
          done
          clang --target=aarch64-none-elf -ffreestanding -fno-builtin -fno-stack-protector \
            -mgeneral-regs-only -O2 -c stub/payload_c.c -o out/payload_c.o
          clang --target=aarch64-none-elf -nostdlib -fuse-ld=lld \
            -Wl,-T,stub/stub.ld -Wl,-e,_start -Wl,--oformat=binary \
            -o out/payload-c.bin stub/payload_c_entry.S out/payload_c.o
          clang --target=aarch64-none-elf -nostdlib -fuse-ld=lld \
            -Wl,-T,stub/stub.ld -Wl,-e,_start -Wl,--oformat=binary \
            -o out/payload-uefi-trampoline.bin stub/payload_uefi_trampoline.S
          python3 - <<'PY'
          import struct

          for name in ("stub", "stub-reset"):
              path = f"out/{name}.bin"
              data = bytearray(open(path, "rb").read())
              target = 0x200000
              if len(data) < target:
                  data += b"\0" * (target - len(data))
              struct.pack_into("<Q", data, 16, target)  # image_size
              open(path, "wb").write(data)
              print(f"{name}: padded to {len(data)} bytes, image_size={target:#x}")

          for name in ("payload-fb-wdt", "payload-pstore", "payload-c"):
              path = f"out/{name}.bin"
              data = bytearray(open(path, "rb").read())
              target = 0x200000
              if len(data) < target:
                  data += b"\0" * (target - len(data))
              open(path, "wb").write(data)
              print(f"{name}: padded to {len(data)} bytes (raw)")
          PY
          for name in stub stub-reset payload-fb-wdt payload-pstore payload-c; do
            gzip -9 -c "out/$name.bin" > "out/$name.bin.gz"
          done
          python3 - <<'PY'
          for name in ("stub", "stub-reset"):
              data = open(f"out/{name}.bin", "rb").read()
              assert len(data) > 0x40, len(data)
              assert data[0x38:0x3C] == b"ARM\x64", data[0x38:0x3C]
              print(f"{name}: {len(data)} bytes, ARM64 magic ok")
          for name in ("payload-fb-wdt", "payload-pstore", "payload-c"):
              data = open(f"out/{name}.bin", "rb").read()
              assert len(data) == 0x200000, len(data)
              print(f"{name}: 2 MiB raw payload")
          PY
          sha256sum out/*.bin out/*.bin.gz

      - name: Upload stubs
        uses: actions/upload-artifact@v4
        with:
          name: stub-${{ github.run_number }}
          path: |
            out/stub.bin
            out/stub.bin.gz
            out/stub-reset.bin
            out/stub-reset.bin.gz
            out/payload-fb-wdt.bin
            out/payload-fb-wdt.bin.gz
            out/payload-pstore.bin
            out/payload-pstore.bin.gz
            out/payload-c.bin
            out/payload-c.bin.gz
            out/payload-uefi-trampoline.bin
          if-no-files-found: error

      - name: Publish stubs to repo
        run: |
          mkdir -p builds
          cp out/stub.bin.gz builds/stub.bin.gz
          cp out/stub-reset.bin.gz builds/stub-reset.bin.gz
          cp out/payload-fb-wdt.bin.gz builds/payload-fb-wdt.bin.gz
          cp out/payload-pstore.bin.gz builds/payload-pstore.bin.gz
          cp out/payload-c.bin.gz builds/payload-c.bin.gz
          cp out/payload-uefi-trampoline.bin builds/payload-uefi-trampoline.bin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f builds/stub.bin.gz builds/stub-reset.bin.gz \
            builds/payload-fb-wdt.bin.gz builds/payload-pstore.bin.gz \
            builds/payload-c.bin.gz builds/payload-uefi-trampoline.bin
          git commit -m "stub build ${GITHUB_RUN_NUMBER}" || echo "no changes"
          git push origin HEAD:charlotte-9010-unixnu

      - name: Pack flashable UEFI boot image
        run: |
          python3 - <<'PY'
          import gzip, struct
          from pathlib import Path

          shim = Path("out/payload-c.bin").read_bytes()
          fd = gzip.decompress(Path("builds/charlotte-uefi.fd.gz").read_bytes())
          size = struct.unpack_from("<Q", shim, 0x10)[0]
          blob = shim + fd
          if len(blob) < size:
              blob += b"\0" * (size - len(blob))
          elif len(blob) > size:
              print("combined > image_size, keeping combined")
          Path("builds/charlotte-uefi-kernel.bin").write_bytes(blob)
          print("kernel", len(blob), "image_size", hex(size))
          PY
          python3 scripts/repack-bootimg.py \
            --stock builds/charlotte-boot.img \
            --kernel builds/charlotte-uefi-kernel.bin \
            --out builds/charlotte-uefi-boot.img \
            --no-gzip-check --no-dtb-check
          git add -f builds/charlotte-uefi-kernel.bin builds/charlotte-uefi-boot.img
          git commit -m "uefi boot ${GITHUB_RUN_NUMBER}" || echo "no changes"
          git push origin HEAD:charlotte-9010-unixnu
