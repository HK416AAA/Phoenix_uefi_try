#
# charlotte / Kirin 9010 (UniXNU) bring-up config
#
[boot_shim]
requires_kernel_header = true

[uefi_fd]
base = 0x80000000
size = 0x300000

[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

[boot_image]
header_version = 2
base           = 0x00000000
kernel_offset  = 0x00000800
tags_offset    = 0x01e00000
dtb            = "Resources/DTBs/charlotte.dtb"
